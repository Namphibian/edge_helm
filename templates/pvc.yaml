{{- $root := . -}}
{{- range $appName, $app := $root.Values.app }}
{{- range $name, $cfg := $app.persistence }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "app.fullname" $root }}-{{ (trim (include "app.kebab" $appName)) }}-{{ (trim (include "app.kebab" $name)) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "app.labels" (list $root $appName) | nindent 4 }}
  {{- if or (and $cfg.backup $cfg.backup.enabled) $cfg.annotations }}
  annotations:
    {{- if and $cfg.backup $cfg.backup.enabled }}
    k10.kasten.io/backup: "true"
    {{- end }}
    {{- if $cfg.annotations }}
    {{- include "annotationsSets" (list $cfg.annotations $root $app.annotationSets) | trim | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    - {{ $cfg.accessMode }}
  {{- if $cfg.storageClass }}
  storageClassName: {{ $cfg.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $cfg.size }}
{{- end }}
{{- end }}
