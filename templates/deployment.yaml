apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
  {{- if and .Values.app.deployment .Values.app.deployment.annotations }}
  annotations:
    {{- include "app.annotations" (list .Values.app.deployment.annotations .) | trim | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ include "app.configValue" (list .Values.app.replicaCount .Values.app.configData "deployment replicas") }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.fullname" . }}-svc
      {{- with .Values.app.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $root := . }}
      {{- $pmap := $root.Values.app.persistence | default dict }}
      {{- $fmap := $root.Values.app.configFiles | default (list) }}
      containers:
      - name: {{ $root.Chart.Name }}
        image: {{ $root.Values.app.image.repository }}:{{ $root.Values.app.image.tag }}
        imagePullPolicy: {{ $root.Values.app.image.pullPolicy }}
        ports:
        {{- range $pkey, $p := $root.Values.app.ports }}
          {{- if $p.containerPort  }}
          - name: {{ lower $p.name }}
            containerPort: {{ include "app.resolvePort" (list $p.port $root.Values.app.configData (printf "container port %s" $pkey)) }}
            protocol: {{ $p.protocol | default "TCP" }}
          {{- end  }}
        {{- end }}
        env:
          {{- range $key, $value := $root.Values.app.env }}
          {{- if and (kindIs "map" $value) (hasKey $value "configDataKey") }}
          {{- $cfgKey := index $value "configDataKey" }}
          {{- $entry := index $root.Values.app.configData $cfgKey }}
          {{- if hasKey $entry "description" }}
          # {{ index $entry "description" }}
          {{- end }}
          {{- end }}
          - name: {{ $key }}
            value: '{{ include "app.envValue" (list $value $root.Values.app.configData (printf "env %s" $key)) }}'
          {{- end }}
        # Liveness Probe
        {{- $liveCfg := $root.Values.app.probes.liveness -}}
        {{- $liveTypeRaw := $liveCfg.probeType -}}
        {{- if not $liveTypeRaw }}{{- fail "probes.liveness.probeType is required" }}{{- end }}
        {{- $liveTypeName := lower $liveTypeRaw -}}
        {{- $liveType := index $root.Values.app.probeTypes $liveTypeRaw -}}
        {{- if not $liveType }}{{- fail (printf "probes.liveness.probeType %q not found under app.probeTypes" $liveTypeRaw) }}{{- end }}
        livenessProbe:
          {{- if eq $liveTypeName "tcpsocket" }}
          tcpSocket:
            port: {{ include "app.resolvePort" (list (index $liveType "port") $root.Values.app.configData "liveness probe") }}
          {{- else if eq $liveTypeName "httpget" }}
          httpGet:
            path: {{ $liveType.path }}
            port: {{ include "app.resolvePort" (list (index $liveType "port") $root.Values.app.configData "liveness probe httpGet") }}
          {{- else if eq $liveTypeName "exec" }}
          exec:
            command:
              {{- range $cmd := $liveType.command }}
              - {{ $cmd | quote }}
              {{- end }}
          {{- else }}
          {{- fail (printf "probes.liveness.probeType %q must be one of tcpSocket/httpGet/exec" $liveTypeRaw) }}
          {{- end }}
          initialDelaySeconds: {{ $liveCfg.initialDelaySeconds }}
          periodSeconds: {{ $liveCfg.periodSeconds }}
          timeoutSeconds: {{ $liveCfg.timeoutSeconds }}
          failureThreshold: {{ $liveCfg.failureThreshold }}
        # Readiness Probe
        {{- $readyCfg := $root.Values.app.probes.readiness -}}
        {{- $readyTypeRaw := $readyCfg.probeType -}}
        {{- if not $readyTypeRaw }}{{- fail "probes.readiness.probeType is required" }}{{- end }}
        {{- $readyTypeName := lower $readyTypeRaw -}}
        {{- $readyType := index $root.Values.app.probeTypes $readyTypeRaw -}}
        {{- if not $readyType }}{{- fail (printf "probes.readiness.probeType %q not found under app.probeTypes" $readyTypeRaw) }}{{- end }}
        readinessProbe:
          {{- if eq $readyTypeName "tcpsocket" }}
          tcpSocket:
            port: {{ include "app.resolvePort" (list (index $readyType "port") $root.Values.app.configData "readiness probe") }}
          {{- else if eq $readyTypeName "httpget" }}
          httpGet:
            path: {{ $readyType.path }}
            port: {{ include "app.resolvePort" (list (index $readyType "port") $root.Values.app.configData "readiness probe httpGet") }}
          {{- else if eq $readyTypeName "exec" }}
          exec:
            command:
              {{- range $cmd := $readyType.command }}
              - {{ $cmd | quote }}
              {{- end }}
          {{- else }}
          {{- fail (printf "probes.readiness.probeType %q must be one of tcpSocket/httpGet/exec" $readyTypeRaw) }}
          {{- end }}
          initialDelaySeconds: {{ $readyCfg.initialDelaySeconds }}
          periodSeconds: {{ $readyCfg.periodSeconds }}
          timeoutSeconds: {{ $readyCfg.timeoutSeconds }}
          failureThreshold: {{ $readyCfg.failureThreshold }}
        {{- $qos := $root.Values.app.resources.qos | default "Guaranteed" }}
        {{- if ne $qos "BestEffort" }}
        resources:
          {{- if eq $qos "Guaranteed" }}
          requests:
            cpu: {{ include "app.configValue" (list $root.Values.app.resources.limits.cpu $root.Values.app.configData "resources limits cpu") }}m
            memory: {{ include "app.configValue" (list $root.Values.app.resources.limits.memory $root.Values.app.configData "resources limits memory") }}
          limits:
            cpu: {{ include "app.configValue" (list $root.Values.app.resources.limits.cpu $root.Values.app.configData "resources limits cpu") }}m
            memory: {{ include "app.configValue" (list $root.Values.app.resources.limits.memory $root.Values.app.configData "resources limits memory") }}
          {{- end }}
          {{- if eq $qos "Burstable" }}
          requests:
            cpu: {{ include "app.configValue" (list $root.Values.app.resources.requests.cpu $root.Values.app.configData "resources requests cpu") }}m
            memory: {{ include "app.configValue" (list $root.Values.app.resources.requests.memory $root.Values.app.configData "resources requests memory") }}
          {{- end }}
          {{- if eq $qos "Burstable" }}
          {{- if $root.Values.app.resources.limits }}
          limits:
            {{- if $root.Values.app.resources.limits.cpu }}
            cpu: {{ include "app.configValue" (list $root.Values.app.resources.limits.cpu $root.Values.app.configData "resources limits cpu") }}m
            {{- end }}
            {{- if $root.Values.app.resources.limits.memory }}
            memory: {{ include "app.configValue" (list $root.Values.app.resources.limits.memory $root.Values.app.configData "resources limits memory") }}
            {{- end }}
          {{- end }}
          {{- end }}
        {{- end }}
        {{- if or (gt (len $pmap) 0) (gt (len $fmap) 0) }}
        volumeMounts:
        {{- range $vname, $vcfg := $pmap }}
          - name: '{{ printf "%s-%s" (trim (include "app.fullname" $root)) (trim (include "app.kebab" $vname)) }}'
            mountPath: {{ $vcfg.mountPath }}
        {{- end }}
        {{- range $idx, $fcfg := $fmap }}
          - name: '{{ include "app.fileResourceName" (list $root $fcfg ) }}'
            {{- if $fcfg.subPath }}
            mountPath: '{{ printf "%s/%s" (trimSuffix "/" $fcfg.mountPath) $fcfg.subPath }}'
            subPath: '{{ $fcfg.subPath }}'
            {{- else }}
            mountPath: {{ $fcfg.mountPath }}
            {{- end }}
            readOnly: true
        {{- end }}
        {{- end }}
      {{- if or (gt (len $pmap) 0) (gt (len $fmap) 0) }}
      volumes:
        {{- range $vname, $vcfg := $pmap }}
        - name: '{{ printf "%s-%s" (trim (include "app.fullname" $root)) (trim (include "app.kebab" $vname)) }}'
          persistentVolumeClaim:
            claimName: '{{ default (printf "%s-%s" (trim (include "app.fullname" $root)) (trim (include "app.kebab" $vname))) $vcfg.claimName }}'
        {{- end }}
        {{- range $idx, $fcfg := $fmap }}
        - name: '{{ include "app.fileResourceName" (list $root $fcfg) }}'
          {{- if eq (lower (default "configmap" $fcfg.type)) "secret" }}
          secret:
            secretName: '{{ include "app.fileResourceName" (list $root $fcfg) }}'
            items:
              - key: '{{ default "content" $fcfg.subPath }}'
                path: '{{ default "content" $fcfg.subPath }}'
          {{- else }}
          configMap:
            name: '{{ include "app.fileResourceName" (list $root $fcfg) }}'
            items:
              - key: '{{ default "content" $fcfg.subPath }}'
                path: '{{ default "content" $fcfg.subPath }}'
          {{- end }}
        {{- end }}
      {{- end }}
