{{- $root := . -}}
{{ $apps := $root.Values.app | default dict -}}
{{- range $appName := (keys $apps | sortAlpha) }}
{{ $app := index $apps $appName -}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app.fullname" $root }}-{{ include "app.kebab" $appName | trim }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "app.labels" (list $root $appName) | nindent 4 }}
  {{- if and $app.deployment $app.deployment.annotations }}
  annotations:
    debug-values: |
      {{- $apps | toPrettyJson | nindent 6 }}

    {{- include "annotationsSets" (list $app.deployment.annotations $root $app.annotationSets) | trim | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ include "app.configValue" (list $app.replicaCount $root.Values.configData (printf "deployment %s replicas" $appName)) }}
  selector:
    matchLabels:
      {{- include "app.selectorLabels" (list $root $appName) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "app.selectorLabels" (list $root $appName) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "app.fullname" $root }}-{{ include "app.kebab" $appName | trim }}-svc
      {{- with $app.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- $volumes := $app.volumes | default dict }}
      {{- $volPvcMap := $volumes.pvc | default dict }}
      {{- $volEmptyDirMap := $volumes.emptyDir | default dict }}
      {{- $globalPersistence := $root.Values.persistence | default dict }}
      {{- $globalPvc := $globalPersistence.pvc | default dict }}
      {{- $globalEmptyDir := $globalPersistence.emptyDir | default dict }}
      {{- $fmap := $app.configFiles | default (list) }}
      {{- $containerPorts := $app.containerPorts | default (list) }}
      {{- if $app.initContainers }}
      initContainers:
      {{- range $initName, $initCfg := $app.initContainers }}
      - name: {{ include "app.kebab" $initName | trim }}
        image: {{ $initCfg.image }}
        imagePullPolicy: {{ $initCfg.imagePullPolicy | default "IfNotPresent" }}
        {{- if $initCfg.command }}
        command:
          {{- toYaml $initCfg.command | nindent 10 }}
        {{- end }}
        {{- if $initCfg.args }}
        args:
          {{- toYaml $initCfg.args | nindent 10 }}
        {{- end }}
        {{- if $initCfg.env }}
        env:
          {{- range $envEntry := $initCfg.env }}
          {{- if hasKey $envEntry "configDataKey" }}
          - name: {{ $envEntry.name }}
            value: '{{ include "app.envValue" (list (dict "configDataKey" $envEntry.configDataKey) $root.Values.configData (printf "initContainer %s env %s" $initName $envEntry.name)) }}'
          {{- else }}
          - name: {{ $envEntry.name }}
            value: {{ $envEntry.value | quote }}
          {{- end }}
          {{- end }}
        {{- end }}
        {{- if $initCfg.envFrom }}
        envFrom:
          {{- toYaml $initCfg.envFrom | nindent 10 }}
        {{- end }}
        {{- $initVolumes := $initCfg.volumes | default dict }}
        {{- $initVolPvc := $initVolumes.pvc | default dict }}
        {{- $initVolEd := $initVolumes.emptyDir | default dict }}
        {{- if or (gt (len $initVolPvc) 0) (gt (len $initVolEd) 0) }}
        volumeMounts:
        {{- range $vname, $vcfg := $initVolPvc }}
          - name: '{{ printf "%s-%s-%s" (trim (include "app.fullname" $root)) (trim (include "app.kebab" $vname)) (trim (include "app.kebab" $appName | trim)) }}'
            mountPath: {{ $vcfg.mountPath }}
        {{- end }}
        {{- range $vname, $vcfg := $initVolEd }}
        {{- if $vcfg.mountPath }}
          - name: '{{ printf "%s-%s-%s" (trim (include "app.fullname" $root)) (trim (include "app.kebab" $vname)) (trim (include "app.kebab" $appName | trim)) }}'
            mountPath: {{ $vcfg.mountPath }}
        {{- end }}
        {{- end }}
        {{- end }}
        {{- $initQos := ($initCfg.resources).qos | default "BestEffort" }}
        {{- if ne $initQos "BestEffort" }}
        resources:
          {{- if eq $initQos "Guaranteed" }}
          requests:
            cpu: {{ $initCfg.resources.limits.cpu }}
            memory: {{ $initCfg.resources.limits.memory }}
          limits:
            cpu: {{ $initCfg.resources.limits.cpu }}
            memory: {{ $initCfg.resources.limits.memory }}
          {{- else if eq $initQos "Burstable" }}
          requests:
            cpu: {{ $initCfg.resources.requests.cpu }}
            memory: {{ $initCfg.resources.requests.memory }}
          {{- if $initCfg.resources.limits }}
          limits:
            {{- if $initCfg.resources.limits.cpu }}
            cpu: {{ $initCfg.resources.limits.cpu }}
            {{- end }}
            {{- if $initCfg.resources.limits.memory }}
            memory: {{ $initCfg.resources.limits.memory }}
            {{- end }}
          {{- end }}
          {{- end }}
        {{- end }}
        {{- if $initCfg.securityContext }}
        securityContext:
          {{- toYaml $initCfg.securityContext | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- end }}
      containers:
      - name: {{ $root.Chart.Name }}
        image: {{ $app.image.repository }}:{{ $app.image.tag }}
        imagePullPolicy: {{ $app.image.pullPolicy }}
        {{- if gt (len $containerPorts) 0 }}
        ports:
        {{- range $idx, $cp := $containerPorts }}
        {{- if not (kindIs "map" $cp) }}{{- fail (printf "app.containerPorts[%d] must be a map with portDefinitionKey" $idx) }}{{- end }}
        {{- if not (hasKey $cp "portDefinitionKey") }}{{- fail (printf "app.containerPorts[%d] must contain portDefinitionKey" $idx) }}{{- end }}
        {{- $pkey := index $cp "portDefinitionKey" }}
        {{- if not (hasKey $root.Values.ports $pkey) }}{{- fail (printf "app.containerPorts[%d] portDefinitionKey %q not found in .Values.ports" $idx $pkey) }}{{- end }}
        {{- $p := index $root.Values.ports $pkey }}
        {{- if eq (include "app.isPortRange" $p) "true" }}
        {{- $expanded := include "app.expandPortRange" (list $p (printf "container port %s" $pkey)) | fromJsonArray }}
        {{- range $ep := $expanded }}
          - name: {{ printf "%s-%s" (lower $ep.name) (trim (include "app.kebab" $appName | trim)) }}
            containerPort: {{ $ep.port }}
            protocol: {{ $ep.protocol }}
        {{- end }}
        {{- else }}
          - name: {{printf "%s-%s" (trim (lower $p.name)) (trim (include "app.kebab" $appName | trim))}}
            containerPort: {{ include "app.resolvePort" (list $p.port $root.Values.configData (printf "container port %s" $pkey)) }}
            protocol: {{ $p.protocol | default "TCP" }}
        {{- end }}
        {{- end }}
        {{- end }}
        env:
          {{- range $key, $value := $app.env }}
          {{- if and (kindIs "map" $value) (hasKey $value "configDataKey") }}
          {{- $cfgKey := index $value "configDataKey" }}
          {{- $entry := index $root.Values.configData $cfgKey }}
          {{- if hasKey $entry "description" }}
          # {{ index $entry "description" }}
          {{- end }}
          {{- end }}
          - name: {{ $key }}
            value: '{{ include "app.envValue" (list $value $root.Values.configData (printf "env %s" $key)) }}'
          {{- end }}
        # Liveness Probe
        {{- $liveCfg := $app.probes.liveness -}}
        {{- $liveTypeRaw := $liveCfg.probeType -}}
        {{- if not $liveTypeRaw }}{{- fail "probes.liveness.probeType is required" }}{{- end }}
        {{- $liveTypeName := lower $liveTypeRaw -}}
        {{- $liveType := index $app.probeTypes $liveTypeRaw -}}
        {{- if not $liveType }}{{- fail (printf "probes.liveness.probeType %q not found under app.probeTypes" $liveTypeRaw) }}{{- end }}
        livenessProbe:
          {{- if eq $liveTypeName "tcpsocket" }}
          tcpSocket:
            port: {{ include "app.resolvePort" (list (index $liveType "port") $root.Values.configData "liveness probe") }}
          {{- else if eq $liveTypeName "httpget" }}
          httpGet:
            path: {{ $liveType.path }}
            port: {{ include "app.resolvePort" (list (index $liveType "port") $root.Values.configData "liveness probe httpGet") }}
          {{- else if eq $liveTypeName "exec" }}
          exec:
            command:
              {{- range $cmd := $liveType.command }}
              - {{ $cmd | quote }}
              {{- end }}
          {{- else }}
          {{- fail (printf "probes.liveness.probeType %q must be one of tcpSocket/httpGet/exec" $liveTypeRaw) }}
          {{- end }}
          initialDelaySeconds: {{ $liveCfg.initialDelaySeconds }}
          periodSeconds: {{ $liveCfg.periodSeconds }}
          timeoutSeconds: {{ $liveCfg.timeoutSeconds }}
          failureThreshold: {{ $liveCfg.failureThreshold }}
        # Readiness Probe
        {{- $readyCfg := $app.probes.readiness -}}
        {{- $readyTypeRaw := $readyCfg.probeType -}}
        {{- if not $readyTypeRaw }}{{- fail "probes.readiness.probeType is required" }}{{- end }}
        {{- $readyTypeName := lower $readyTypeRaw -}}
        {{- $readyType := index $app.probeTypes $readyTypeRaw -}}
        {{- if not $readyType }}{{- fail (printf "probes.readiness.probeType %q not found under app.probeTypes" $readyTypeRaw) }}{{- end }}
        readinessProbe:
          {{- if eq $readyTypeName "tcpsocket" }}
          tcpSocket:
            port: {{ include "app.resolvePort" (list (index $readyType "port") $root.Values.configData "readiness probe") }}
          {{- else if eq $readyTypeName "httpget" }}
          httpGet:
            path: {{ $readyType.path }}
            port: {{ include "app.resolvePort" (list (index $readyType "port") $root.Values.configData "readiness probe httpGet") }}
          {{- else if eq $readyTypeName "exec" }}
          exec:
            command:
              {{- range $cmd := $readyType.command }}
              - {{ $cmd | quote }}
              {{- end }}
          {{- else }}
          {{- fail (printf "probes.readiness.probeType %q must be one of tcpSocket/httpGet/exec" $readyTypeRaw) }}
          {{- end }}
          initialDelaySeconds: {{ $readyCfg.initialDelaySeconds }}
          periodSeconds: {{ $readyCfg.periodSeconds }}
          timeoutSeconds: {{ $readyCfg.timeoutSeconds }}
          failureThreshold: {{ $readyCfg.failureThreshold }}
        {{- $qos := $app.resources.qos | default "Guaranteed" }}
        {{- if ne $qos "BestEffort" }}
        resources:
          {{- if eq $qos "Guaranteed" }}
          requests:
            cpu: {{ include "app.configValue" (list $app.resources.limits.cpu $root.Values.configData "resources limits cpu") }}m
            memory: {{ include "app.configValue" (list $app.resources.limits.memory $root.Values.configData "resources limits memory") }}
          limits:
            cpu: {{ include "app.configValue" (list $app.resources.limits.cpu $root.Values.configData "resources limits cpu") }}m
            memory: {{ include "app.configValue" (list $app.resources.limits.memory $root.Values.configData "resources limits memory") }}
          {{- end }}
          {{- if eq $qos "Burstable" }}
          requests:
            cpu: {{ include "app.configValue" (list $app.resources.requests.cpu $root.Values.configData "resources requests cpu") }}m
            memory: {{ include "app.configValue" (list $app.resources.requests.memory $root.Values.configData "resources requests memory") }}
          {{- end }}
          {{- if eq $qos "Burstable" }}
          {{- if $app.resources.limits }}
          limits:
            {{- if $app.resources.limits.cpu }}
            cpu: {{ include "app.configValue" (list $app.resources.limits.cpu $root.Values.configData "resources limits cpu") }}m
            {{- end }}
            {{- if $app.resources.limits.memory }}
            memory: {{ include "app.configValue" (list $app.resources.limits.memory $root.Values.configData "resources limits memory") }}
            {{- end }}
          {{- end }}
          {{- end }}
        {{- end }}
        {{- if or (gt (len $volPvcMap) 0) (gt (len $volEmptyDirMap) 0) (gt (len $fmap) 0) }}
        volumeMounts:
        {{- range $vname, $vcfg := $volPvcMap }}
          - name: '{{ printf "%s-%s-%s" (trim (include "app.fullname" $root)) (trim (include "app.kebab" $vname)) (trim (include "app.kebab" $appName | trim)) }}'
            mountPath: {{ $vcfg.mountPath }}
        {{- end }}
        {{- range $vname, $vcfg := $volEmptyDirMap }}
        {{- if $vcfg.mountPath }}
          - name: '{{ printf "%s-%s-%s" (trim (include "app.fullname" $root)) (trim (include "app.kebab" $vname)) (trim (include "app.kebab" $appName | trim)) }}'
            mountPath: {{ $vcfg.mountPath }}
        {{- end }}
        {{- end }}
        {{- range $idx, $fcfg := $fmap }}
          - name: '{{ printf "%s-%s" (trim (include "app.fileResourceName" (list $root $fcfg))) (trim (include "app.kebab" $appName | trim)) }}'
            {{- if $fcfg.subPath }}
            mountPath: '{{ printf "%s/%s" (trimSuffix "/" $fcfg.mountPath) $fcfg.subPath }}'
            subPath: '{{ $fcfg.subPath }}'
            {{- else }}
            mountPath: {{ $fcfg.mountPath }}
            {{- end }}
            readOnly: true
        {{- end }}
        {{- end }}
      {{- $initCtrMap := $app.initContainers | default dict }}
      {{- $allInitVolPvc := dict }}
      {{- $allInitVolEd := dict }}
      {{- range $_, $ic := $initCtrMap }}
      {{- range $vn, $vc := (($ic.volumes | default dict).pvc | default dict) }}
      {{- $_ := set $allInitVolPvc $vn $vc }}
      {{- end }}
      {{- range $vn, $vc := (($ic.volumes | default dict).emptyDir | default dict) }}
      {{- $_ := set $allInitVolEd $vn $vc }}
      {{- end }}
      {{- end }}
      {{- $mergedPvc := merge $volPvcMap $allInitVolPvc }}
      {{- $mergedEd := merge $volEmptyDirMap $allInitVolEd }}
      {{- if or (gt (len $mergedPvc) 0) (gt (len $mergedEd) 0) (gt (len $fmap) 0) }}
      volumes:
        {{- range $vname, $vcfg := $mergedPvc }}
        - name: '{{ printf "%s-%s-%s" (trim (include "app.fullname" $root)) (trim (include "app.kebab" $vname)) (trim (include "app.kebab" $appName | trim)) }}'
          persistentVolumeClaim:
            claimName: '{{ default (printf "%s-%s-%s" (trim (include "app.fullname" $root)) (trim (include "app.kebab" $vname)) (trim (include "app.kebab" $appName | trim))) $vcfg.claimName }}'
        {{- end }}
        {{- range $vname, $vcfg := $mergedEd }}
        {{- $globalEd := index $globalEmptyDir $vname | default dict }}
        - name: '{{ printf "%s-%s-%s" (trim (include "app.fullname" $root)) (trim (include "app.kebab" $vname)) (trim (include "app.kebab" $appName | trim)) }}'
          emptyDir:
            {{- if $globalEd.medium }}
            medium: {{ $globalEd.medium | quote }}
            {{- end }}
            {{- if $globalEd.sizeLimit }}
            sizeLimit: {{ $globalEd.sizeLimit | quote }}
            {{- end }}
        {{- end }}
        {{- range $idx, $fcfg := $fmap }}
        - name: '{{ printf "%s-%s" (trim (include "app.fileResourceName" (list $root $fcfg))) (trim (include "app.kebab" $appName | trim)) }}'
          {{- if eq (lower (default "configmap" $fcfg.type)) "secret" }}
          secret:
            secretName: '{{ printf "%s-%s" (trim (include "app.fileResourceName" (list $root $fcfg))) (trim (include "app.kebab" $appName | trim)) }}'
            items:
              - key: '{{ default "content" $fcfg.subPath }}'
                path: '{{ default "content" $fcfg.subPath }}'
          {{- else }}
          configMap:
            name: '{{ printf "%s-%s" (trim (include "app.fileResourceName" (list $root $fcfg))) (trim (include "app.kebab" $appName | trim)) }}'
            items:
              - key: '{{ default "content" $fcfg.subPath }}'
                path: '{{ default "content" $fcfg.subPath }}'
          {{- end }}
        {{- end }}
      {{- end }}
{{- end }}
---