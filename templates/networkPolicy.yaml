{{- $root := . -}}
{{- $appName := first (keys $root.Values.app | sortAlpha) -}}
{{- $app := index $root.Values.app $appName -}}
{{- with $app.networkPolicy }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" $root }}-ingress
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "app.labels" $root | nindent 4 }}
  {{- if .ingress.annotations }}
  annotations:
    {{- include "annotationsSets" (list .ingress.annotations $root) | trim | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" $root | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .ingress.allowedSources }}
        - {{ .type }}:
            matchLabels:
              {{- range $k, $v := .matchLabels }}
              {{ $k }}: {{ $v | quote }}
              {{- end }}
        {{- end }}
      ports:
        {{- range .ingress.ports }}
        {{- $portDef := index $root.Values.ports . }}
        - protocol: {{ $portDef.protocol | default "TCP" }}
          port: {{ include "app.resolvePort" (list $portDef.port $root.Values.configData (printf "networkpolicy ingress port %s" .) true) }}
        {{ end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "app.fullname" $root }}-egress
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "app.labels" $root | nindent 4 }}
  {{- if .egress.annotations }}
  annotations:
    {{- include "annotationsSets" (list .egress.annotations $root) | trim | nindent 4 }}
  {{- end }}
spec:
  podSelector:
    matchLabels:
      {{- include "app.selectorLabels" $root | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    {{ range .egress.allowedHosts }}
    {{- $egName := default "<unnamed>" .name -}}
    {{- if not (kindIs "map" .port) -}}
      {{- fail (printf "networkpolicy egress %s port must be a map with configDataKey to a url-type configData entry (e.g. buyboostOpenapiHost.port)" $egName) -}}
    {{- end -}}
    {{- if not (hasKey .port "configDataKey") -}}
      {{- fail (printf "networkpolicy egress %s port must use configDataKey (portDefinitionKey is not allowed)" $egName) -}}
    {{- end -}}
    {{- $er := include "app.resolveConfigDataEntry" (list (index .port "configDataKey") $root.Values.configData (printf "networkpolicy egress %s port" $egName)) | fromJson -}}
    {{- if ne $er.type "url" -}}
      {{- fail (printf "networkpolicy egress %s port configDataKey %q must reference a configData entry with type 'url'" $egName $er.cfgKey) -}}
    {{- end -}}
    - to:
        - ipBlock:
            cidr: {{ include "app.configValue" (list .ip $root.Values.configData (printf "networkpolicy egress %s ip" .name)) }}/32
      ports:
        - protocol: TCP
          port: {{ include "app.resolvePort" (list .port $root.Values.configData (printf "networkpolicy egress %s port" .name)) }}
    {{ end }}
{{- end }}
