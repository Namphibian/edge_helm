{{- $root := . -}}
{{- $services := $root.Values.services | default dict -}}
{{- $apps := $root.Values.app | default dict -}}
{{- $groups := list
      (dict "valuesKey" "clusterIp"    "serviceType" "ClusterIP"    "headless" false "external" false "requiresTargetApps" true)
      (dict "valuesKey" "nodePort"     "serviceType" "NodePort"     "headless" false "external" false "requiresTargetApps" true)
      (dict "valuesKey" "loadBalancer" "serviceType" "LoadBalancer" "headless" false "external" false "requiresTargetApps" true)
      (dict "valuesKey" "externalName" "serviceType" "ExternalName" "headless" false "external" true)
      (dict "valuesKey" "headless"     "serviceType" "ClusterIP"    "headless" true  "external" false)
      (dict "valuesKey" "headles"      "serviceType" "ClusterIP"    "headless" true  "external" false)
  -}}
{{- range $g := $groups }}
{{- $svcMap := index $services (index $g "valuesKey") | default dict -}}
{{- range $svcName := (keys $svcMap | sortAlpha) }}
{{- $svc := index $svcMap $svcName -}}
{{- $requiresTargetApps := index $g "requiresTargetApps" | default false -}}
{{- if $requiresTargetApps -}}
  {{- if not (hasKey $svc "targetApps") -}}
    {{- fail (printf "service %s.%s must define targetApps" (index $g "valuesKey") $svcName) -}}
  {{- end -}}
  {{- if not (kindIs "slice" $svc.targetApps) -}}
    {{- fail (printf "service %s.%s targetApps must be a list" (index $g "valuesKey") $svcName) -}}
  {{- end -}}
  {{- if eq (len $svc.targetApps) 0 -}}
    {{- fail (printf "service %s.%s targetApps must not be empty" (index $g "valuesKey") $svcName) -}}
  {{- end -}}
{{- end -}}
{{- $targetApps := list "" -}}
{{- if $requiresTargetApps -}}
  {{- $targetApps = $svc.targetApps -}}
{{- end -}}
{{- range $targetApp := $targetApps }}
{{- if $requiresTargetApps -}}
  {{- if not $targetApp -}}
    {{- fail (printf "service %s.%s targetApps entries must be non-empty app names" (index $g "valuesKey") $svcName) -}}
  {{- end -}}
  {{- if not (hasKey $apps $targetApp) -}}
    {{- fail (printf "service %s.%s targetApp %q not found in .Values.app" (index $g "valuesKey") $svcName $targetApp) -}}
  {{- end -}}
{{- end -}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "app.fullname" $root }}{{- if $requiresTargetApps }}-{{ $targetApp }}{{- end }}-{{ $svcName }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- if $requiresTargetApps }}
    {{- include "app.labels" (list $root $targetApp) | nindent 4 }}
    {{- else }}
    {{- include "app.labels" $root | nindent 4 }}
    {{- end }}
  {{- if $svc.annotations }}
  annotations:
    {{- include "annotationsSets" (list $svc.annotations $root) | trim | nindent 4 }}
  {{- end }}
spec:
  type: {{ index $g "serviceType" }}
  {{- if index $g "headless" }}
  clusterIP: None
  {{- end }}
  {{- if index $g "external" }}
  externalName: {{ $svc.externalName }}
  {{- else }}
  selector:
    {{- if $requiresTargetApps }}
    {{- include "app.selectorLabels" (list $root $targetApp) | nindent 4 }}
    {{- else }}
    {{- include "app.selectorLabels" $root | nindent 4 }}
    {{- end }}
  {{- if not $svc.ports }}
  {{- fail (printf "service %s must define ports" $svcName) }}
  {{- end }}
  ports:
    {{- range $sp := $svc.ports }}
    {{- $srcKey := $sp.sourcePort }}
    {{- if kindIs "map" $sp.sourcePort -}}
      {{- if hasKey $sp.sourcePort "portDefinitionKey" -}}
        {{- $srcKey = index $sp.sourcePort "portDefinitionKey" -}}
      {{- else -}}
        {{- fail (printf "service %s sourcePort must be string key or map with portDefinitionKey" $svcName) -}}
      {{- end -}}
    {{- end -}}
    {{- $tgtKey := $sp.targetPort }}
    {{- if kindIs "map" $sp.targetPort -}}
      {{- if hasKey $sp.targetPort "portDefinitionKey" -}}
        {{- $tgtKey = index $sp.targetPort "portDefinitionKey" -}}
      {{- else -}}
        {{- fail (printf "service %s targetPort must be string key or map with portDefinitionKey" $svcName) -}}
      {{- end -}}
    {{- end -}}
    {{- if not (hasKey $root.Values.ports $srcKey) -}}
      {{- fail (printf "service %s sourcePort key %q not found in .Values.ports" $svcName $srcKey) -}}
    {{- end -}}
    {{- if not (hasKey $root.Values.ports $tgtKey) -}}
      {{- fail (printf "service %s targetPort key %q not found in .Values.ports" $svcName $tgtKey) -}}
    {{- end -}}
    {{- $srcDef := index $root.Values.ports $srcKey }}
    {{- $tgtDef := index $root.Values.ports $tgtKey }}
    {{- $srcIsRange := include "app.isPortRange" $srcDef -}}
    {{- $tgtIsRange := include "app.isPortRange" $tgtDef -}}
    {{- if eq $srcIsRange "true" }}
    {{- $expanded := include "app.expandPortRange" (list $srcDef (printf "service %s source port %s" $svcName $srcKey)) | fromJsonArray }}
    {{- range $ep := $expanded }}
    - name: {{ lower $ep.name }}-{{ $targetApp }}-{{ $svcName }}
      port: {{ $ep.port }}
      targetPort: {{ $ep.port }}
      protocol: {{ $ep.protocol }}
    {{- end }}
    {{- else if eq $tgtIsRange "true" }}
    {{- $expanded := include "app.expandPortRange" (list $tgtDef (printf "service %s target port %s" $svcName $tgtKey)) | fromJsonArray }}
    {{- range $ep := $expanded }}
    - name: {{ lower $ep.name }}-{{ $targetApp }}-{{ $svcName }}
      port: {{ $ep.port }}
      targetPort: {{ $ep.port }}
      protocol: {{ $ep.protocol }}
    {{- end }}
    {{- else }}
    - name: {{ lower $srcDef.name }}-{{ $targetApp }}-{{ $svcName }}
      port: {{ include "app.resolvePort" (list $srcDef.port $root.Values.configData (printf "service %s source port %s" $svcName $srcKey) true) }}
      targetPort: {{ include "app.resolvePort" (list $tgtDef.port $root.Values.configData (printf "service %s target port %s" $svcName $tgtKey) true) }}
      protocol: {{ $srcDef.protocol | default "TCP" }}
    {{- end }}
    {{ end }}
  {{ end }}
{{ end }}
{{ end }}
{{ end }}
