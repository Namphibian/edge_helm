{{- $root := . -}}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata:
  name: {{ include "app.fullname" $root }}-min-ro-role-binding
  namespace: {{ $root.Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name:  {{ include "app.fullname" $root }}-svc
    namespace: {{ $root.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "app.fullname" $root }}-min-ro-role
  apiGroup: rbac.authorization.k8s.io
