{{- $root := . -}}
{{- $globalPvc := ($root.Values.persistence | default dict).pvc | default dict }}
{{- range $appName, $app := $root.Values.app }}
{{- $volPvcMap := (($app.volumes | default dict).pvc | default dict) }}
{{- range $name, $volCfg := $volPvcMap }}
{{- $cfg := index $globalPvc $name | default dict }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "app.fullname" $root }}-{{ (trim (include "app.kebab" $appName)) }}-{{ (trim (include "app.kebab" $name)) }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    {{- include "app.labels" (list $root $appName) | nindent 4 }}
  {{- $annots := $volCfg.annotations | default $cfg.annotations }}
  {{- if or (and $cfg.backup $cfg.backup.enabled) $annots }}
  annotations:
    {{- if and $cfg.backup $cfg.backup.enabled }}
    k10.kasten.io/backup: "true"
    {{- end }}
    {{- if $annots }}
    {{- include "annotationsSets" (list $annots $root $app.annotationSets) | trim | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  accessModes:
    - {{ $cfg.accessMode }}
  {{- if $cfg.storageClass }}
  storageClassName: {{ $cfg.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $cfg.size }}
{{- end }}
{{- end }}
